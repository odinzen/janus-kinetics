[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "janus-kinetics"
version = "0.1.0"
description = "Multicomponent diffusion, moving boundaries and precipitation kinetics on top of pycalphad"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Michael E. Bustamante" }]
requires-python = ">=3.10"
dependencies = [
    "pycalphad>=0.11",
    "numpy",
    "scipy",
    "symengine",
]
keywords = ["CALPHAD", "diffusion", "kinetics", "precipitation", "pycalphad", "materials science"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
]

[project.urls]
Repository = "https://github.com/odinzen/janus-kinetics"

[project.optional-dependencies]
test = ["pytest"]
# optional bridge to kawin (janus_kinetics.kawin_bridge)
kawin = ["kawin>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
janus_kinetics = ["data/*.tdb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["slow: takes 5 s or more; pytest -m \"not slow\" runs the rest"]
filterwarnings = [
    "ignore:The type definition character:UserWarning",
    # raised inside pycalphad.calculate under numpy >= 2.5, not by this package
    "ignore:Setting the shape on a NumPy array:DeprecationWarning",
]
