[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "calphad-kinetics"
version = "0.1.0.dev0"
description = "Multicomponent diffusion kinetics on top of pycalphad"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Michael E. Bustamante", email = "michaelbusta@odinzen.io" }]
requires-python = ">=3.10"
dependencies = [
    "pycalphad>=0.11",
    "numpy",
    "scipy",
    "symengine",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:The type definition character:UserWarning",
    # raised inside pycalphad.calculate under numpy >= 2.5, not by this package
    "ignore:Setting the shape on a NumPy array:DeprecationWarning",
]
